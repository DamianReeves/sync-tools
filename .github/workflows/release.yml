name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Required for GoReleaser to push to homebrew tap
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Fetch all history for GoReleaser changelog generation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      # Run comprehensive test suite before release
      - name: Run BDD tests (mandatory 100% pass rate)
        run: |
          go test ./test/bdd -tags bdd -v

      - name: Run full test suite
        run: |
          go test ./...

      - name: Verify build works
        run: |
          go build -o sync-tools ./cmd/sync-tools
          ./sync-tools --version || echo "Version command not implemented yet"
          ./sync-tools --help

      # Release with GoReleaser
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token for updating homebrew tap - needs to be set in repository secrets
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Post-release verification
      - name: Verify release artifacts
        if: success()
        run: |
          echo "Release completed successfully!"
          echo "Homebrew formula should be updated in DamianReeves/homebrew-tap"
          echo "Users can now install with: brew tap DamianReeves/tap && brew install sync-tools"
