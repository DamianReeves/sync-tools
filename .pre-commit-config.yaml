# Pre-commit hooks configuration for sync-tools
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: "Format Go code with gofmt"
        entry: gofmt
        args: [-w]
        language: system
        files: \.go$
        pass_filenames: true

      - id: go-vet
        name: go vet
        description: "Run go vet on Go files"
        entry: go
        args: [vet, ./...]
        language: system
        files: \.go$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        description: "Run golangci-lint"
        entry: bash
        args:
          - -c
          - |
            if ! command -v golangci-lint &> /dev/null; then
              echo "Installing golangci-lint..."
              go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
              export PATH=$PATH:$(go env GOPATH)/bin
            fi
            $(go env GOPATH)/bin/golangci-lint run --fix
        language: system
        files: \.go$
        pass_filenames: false

      - id: go-build
        name: go build
        description: "Build Go project to ensure it compiles"
        entry: go
        args: [build, -o, sync-tools, ./cmd/sync-tools]
        language: system
        files: \.go$
        pass_filenames: false

      - id: go-test
        name: go test
        description: "Run Go tests"
        entry: go
        args: [test, ./...]
        language: system
        files: \.go$
        pass_filenames: false
